<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Deep obsidian dark background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <!-- Shiny white-to-blue metallic chrome gradient -->
    <linearGradient id="shinyChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e0f2fe"/>
      <stop offset="65%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Electric luminous neon blue glow gradient -->
    <linearGradient id="neonBlue" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Intense electric blue glow filter -->
    <filter id="electricGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.22
        0 0 0 0 0.74
        0 0 0 0 0.97
        0 0 0 1 0" in="blur" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Badge -->
  <circle cx="50" cy="50" r="47" fill="url(#bg)" stroke="url(#shinyChrome)" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Backing Electric Glow Waves -->
  <path d="M12 50 L22 50 L28 32 L36 68 L44 24 L52 74 L60 28 L68 64 L74 38 L80 50 L88 50" 
        stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" 
        filter="url(#electricGlow)" opacity="0.9"/>

  <!-- Shiny White Chrome Sharp Chaos Soundwave Overlay -->
  <path d="M12 50 L22 50 L28 32 L36 68 L44 24 L52 74 L60 28 L68 64 L74 38 L80 50 L88 50" 
        stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Shiny White Apex Star / Flare at center spike -->
  <circle cx="52" cy="74" r="2.2" fill="#ffffff" filter="url(#electricGlow)"/>
  <circle cx="44" cy="24" r="2.5" fill="#ffffff" filter="url(#electricGlow)"/>
</svg>
